[package]
name = "hyprforge-lock"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hyprforge-lock"
path = "src/main.rs"

[dependencies]
hyprforge-authui.workspace = true
hyprforge-paths.workspace = true
hyprforge-look.workspace = true
# default-features off drops softbuffer: this paints into the buffer the
# compositor hands over, so it has no use for a windowing backend.
iced_tiny_skia = { workspace = true, default-features = false, features = ["image"] }
iced_runtime.workspace = true
iced_widget = { workspace = true, features = ["image"] }
tiny-skia = "0.11"
chrono.workspace = true
image.workspace = true
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
# Versions pinned to whatever smithay-client-toolkit 0.20 already pulls
# in. The Wayland source and the ping have to come from the *same*
# calloop as the toolkit's, or the event loop can't hold both.
calloop = "0.14"
calloop-wayland-source = "0.4"
pam-client2 = "0.5"
thiserror.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile = "3"
