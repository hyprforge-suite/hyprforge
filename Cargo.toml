[workspace]
resolver = "3"
members = [
    "crates/hyprforge-core",
    "crates/hyprforge-process",
    "crates/hyprforge-secret",
    "crates/hyprforge-displayd",
    "crates/hyprforge-windowrules",
    "crates/hyprforge-input",
    "crates/hyprforge-appearance",
    "crates/hyprforge-ecosystem",
    "crates/hyprforge-session",
    "crates/hyprforge-system",
    "crates/hyprforge-authui",
    "crates/hyprforge-paths",
    "crates/hyprforge-keys",
    "crates/hyprforge-look",
    "crates/hyprforge-ui",
    "crates/hyprforge-lock",
    "crates/hyprforge-greet",
    "crates/hyprforge-shortcuts",
    "crates/hyprforge-lua-import",
    "crates/hyprforge-bluetooth",
    "crates/hyprforge-clipboard",
    "crates/hyprforge-popup",
    "crates/hyprforge-emoji",
    "crates/hyprforge-emojimenu",
    "crates/hyprforge-tray",
    "crates/hyprforge-network",
    "crates/hyprforge-power",
    "crates/hyprforge-settings",
    "crates/hyprforge-mime",
    "crates/hyprforge-icons",
    "crates/hyprforge-thumbnails",
    "crates/hyprforge-fileops",
    "crates/hyprforge-listing",
    "crates/hyprforge-image",
    "crates/hyprforge-mesh",
    "crates/hyprforge-video",
    "crates/hyprforge-photos",
    "crates/hyprforge-archive",
    "crates/hyprforge-files-core",
    "crates/hyprforge-files",
]
# `notif/` is a nested cargo workspace, deliberately kept out of this one.
#
# Not tidiness — a feature-unification bug that would only appear at
# runtime. Cargo unifies features across a workspace, and zbus picks its
# async runtime with `#[cfg(feature = "tokio")]`: the suite needs
# `zbus/tokio`, notif builds on `zbus/async-io`. Unified, tokio wins
# for both, and notif's D-Bus code takes a tokio path with no tokio
# runtime under it — an immediate panic, with nothing at compile time
# to see it coming. Excluded, each workspace resolves its own graph.
#
# The seam costs one thing: `cargo test --workspace` here does not run
# notif's tests. check.sh's "notif workspace" step is what covers that.
exclude = ["notif"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# default-features = false so nobody picks up the optional `dbus`
# (zbus) support by accident; only the settings app, displayctl and the
# tray want it.
hyprforge-core = { path = "crates/hyprforge-core", default-features = false }
hyprforge-process = { path = "crates/hyprforge-process", version = "0.1.0" }
hyprforge-secret = { path = "crates/hyprforge-secret", version = "0.1.0" }
hyprforge-windowrules = { path = "crates/hyprforge-windowrules" }
hyprforge-input = { path = "crates/hyprforge-input" }
hyprforge-appearance = { path = "crates/hyprforge-appearance" }
hyprforge-ecosystem = { path = "crates/hyprforge-ecosystem" }
hyprforge-session = { path = "crates/hyprforge-session" }
hyprforge-system = { path = "crates/hyprforge-system" }
hyprforge-authui = { path = "crates/hyprforge-authui" }
hyprforge-paths = { path = "crates/hyprforge-paths", version = "0.1.0" }
# The suite's keyboard grammar — one parser and one merge policy, so
# `Ctrl+Shift+N` means the same thing in every app that binds a key.
# Deliberately iced-free; the toolkit adapter lives in hyprforge-ui.
hyprforge-keys = { path = "crates/hyprforge-keys", version = "0.1.0" }
hyprforge-look = { path = "crates/hyprforge-look", version = "0.1.0" }
hyprforge-ui = { path = "crates/hyprforge-ui" }
hyprforge-lock = { path = "crates/hyprforge-lock" }
hyprforge-shortcuts = { path = "crates/hyprforge-shortcuts" }
hyprforge-lua-import = { path = "crates/hyprforge-lua-import" }
hyprforge-network = { path = "crates/hyprforge-network" }
hyprforge-bluetooth = { path = "crates/hyprforge-bluetooth" }
hyprforge-power = { path = "crates/hyprforge-power" }
hyprforge-tray = { path = "crates/hyprforge-tray" }
hyprforge-clipboard = { path = "crates/hyprforge-clipboard" }
hyprforge-popup = { path = "crates/hyprforge-popup" }
hyprforge-emoji = { path = "crates/hyprforge-emoji", version = "0.1.0" }
hyprforge-emojimenu = { path = "crates/hyprforge-emojimenu" }
hyprforge-fileops = { path = "crates/hyprforge-fileops" }
# What a directory listing is, how it is read and what order it is in —
# the leaf under both the file manager and the image viewer, so the two
# cannot disagree about which picture comes next in a folder.
hyprforge-listing = { path = "crates/hyprforge-listing", version = "0.1.0" }
# Measuring, orienting and decoding a picture within a budget — the leaf
# under the image viewer, and under the file manager's preview pane when
# that grows one.
hyprforge-image = { path = "crates/hyprforge-image", version = "0.1.0" }
hyprforge-mesh = { path = "crates/hyprforge-mesh", version = "0.1.0" }
hyprforge-video = { path = "crates/hyprforge-video", version = "0.1.0" }
hyprforge-photos = { path = "crates/hyprforge-photos" }
hyprforge-files-core = { path = "crates/hyprforge-files-core" }
# Zip, tar and 7z, for the file manager's archive browsing. A leaf, like
# hyprforge-mime beside it — nothing GUI and nothing Hyprland-shaped.
hyprforge-archive = { path = "crates/hyprforge-archive" }
hyprforge-mime = { path = "crates/hyprforge-mime" }
# Which file is the icon called `image-png`, through the configured icon
# theme and what it inherits. A leaf beside hyprforge-mime, which knows
# which *name* a type's icon has.
hyprforge-icons = { path = "crates/hyprforge-icons" }
# The freedesktop thumbnail cache, shared with every other program that
# thumbnails files. A leaf; pixels in, pixels out.
hyprforge-thumbnails = { path = "crates/hyprforge-thumbnails" }
hyprforge-files = { path = "crates/hyprforge-files" }

# Only hyprforge-lua-import depends on this — evaluating a user's own
# hyprland.lua (with hl.* stubbed to record calls) to import hand-written
# rules/binds/monitor config, rather than text-parsing it, which breaks on
# the near-universal `mainMod .. " + Q"` variable pattern. Vendored so it
# doesn't need a system Lua install.
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }

# `web-colors` is in iced's own default features and is the reason the
# greeter looked washed out beside the lock screen. It skips the
# sRGB->linear conversion on the wgpu path, so a colour reaches an sRGB
# surface already encoded and gets encoded again: the theme's
# `surface = rgba(26263aff)` — (38, 38, 58) — rendered as (107, 107, 130),
# which is srgb_encode(38/255) to within a rounding step.
#
# `iced_tiny_skia` has no such feature, so the lock screen was unaffected
# and the two hosts drew the same theme in visibly different colours.
# That is the exact failure this suite exists to prevent, occurring
# inside the suite, and no amount of sharing one `Theme` would have
# caught it — the divergence is below the colour, in what the renderer
# does with it.
#
# Everything else iced enables by default is kept.
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
] }
# The auth screen's clock. default-features off: no serde, no oldtime,
# no wasm bindings — a lock screen wants the smallest thing that can
# format a strftime string.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iced_widget = "0.14"
iced_runtime = "0.14"
iced_tiny_skia = { version = "0.14.1", default-features = false }
# iced_graphics enables the `image` crate with no format features at all,
# so without this there is no PNG decoder and every wallpaper fails to
# load. Cargo unifies features across the dependency graph, so declaring
# the formats here is what switches them on for iced.
#
# PNG, JPEG, WebP and GIF — what the image viewer opens, chosen rather
# than maximal. It is a workspace-level decision rather than one app's,
# for the unification reason above: these switch on for the lock screen,
# the greeter, clipmenu, Settings and Files too, so every format added
# here is a decoder linked into every app that draws an image.
#
# bmp, tiff and ico were switched on when Files' preview pane was asked
# to show more kinds of picture (2026-09-25); the viewer's desktop entry
# claims them in the same change, and `hyprforge-photos`'s
# `the_desktop_entry_claims_exactly_what_this_build_decodes` keeps the two
# in step from now on.
#
# Not on in this list: tga, qoi, pnm, hdr, exr, ff. But not off either,
# in any app that draws an image — iced's `image` feature switches on
# `image`'s *default* codecs, which is all of these, so the viewer and
# Files decode them regardless of this line (measured 2026-09-25 with
# `cargo tree -e features -i image`). This list is the floor, not the
# set; the viewer's desktop entry is checked against what its build
# actually decodes, not against this.
#
# Two that must stay off, and both would be easy to add by mistake:
#
# - `avif` is an *encoder* (ravif). Decoding AVIF needs `avif-native`,
#   which links the system libdav1d — a C dependency for every one of the
#   apps above, and a new `depends` line in the PKGBUILD. Worse, the check
#   `hyprforge-image` uses to decide what it can open,
#   `ImageFormat::reading_enabled()`, reports AVIF readable whenever
#   `avif` is on — so enabling the encoder alone would have the viewer
#   claim `image/avif` in its .desktop file and then fail to open one.
# - `dds` has a feature but `reading_enabled()` answers `false` for it
#   unconditionally: there is no DDS decoder to switch on.
#
# HEIC is not on the list because `image` cannot do it under any feature.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
# The EXIF reader iced_graphics already pulls in for its own orientation
# handling, named here so `hyprforge-image::camera` reads the same crate
# at the same version rather than a second copy.
exif = { package = "kamadak-exif", version = "0.6" }
# Run zbus on tokio rather than its default async-io executor. Without this
# zbus polls connections on its own thread, so D-Bus method handlers execute
# outside any tokio runtime and anything they spawn (the displayd revert
# timer) panics with "there is no reactor running".
zbus = { version = "5.18", default-features = false, features = ["tokio"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
blake3 = "1.8"
futures-util = "0.3"
# Already in the tree via zbus. Taken as a direct dependency so
# `NetworkBackend` can be used behind `Arc<dyn _>`, the same shape
# displayd's `OutputBackend` uses to make its daemon testable.
async-trait = "0.1"

# `hyprforge-clipboard`, `hyprforge-lock` and `hyprforge-greet` each name
# their Hyprforge dependencies as git dependencies on this same
# repository's GitHub URL, not path dependencies — those manifests have
# to build unchanged both in here and as the root of their own
# standalone repository after `git subtree split` pulls them out, and a
# standalone repo has no workspace to path into. Left alone, that would
# make every build here reach across the network for crates that are
# sitting right there in `crates/`. This patch is what stops that: it
# rewrites those git dependencies back to the local directories for
# anyone building inside this workspace, so resolution never leaves disk
# and `cargo build` keeps working with no network access at all. Do not
# delete an entry thinking it is unused just because nothing in
# `[workspace.dependencies]` names a git URL — each exists entirely for
# a split crate's sake.
[patch."https://github.com/adamrpostjr/hyprforge"]
hyprforge-paths = { path = "crates/hyprforge-paths" }
hyprforge-secret = { path = "crates/hyprforge-secret" }
hyprforge-authui = { path = "crates/hyprforge-authui" }
hyprforge-look = { path = "crates/hyprforge-look" }
hyprforge-network = { path = "crates/hyprforge-network" }
hyprforge-bluetooth = { path = "crates/hyprforge-bluetooth" }
hyprforge-power = { path = "crates/hyprforge-power" }
hyprforge-ecosystem = { path = "crates/hyprforge-ecosystem" }
# The rest of these exist for hyprforge-settings alone: it is the hub
# of the suite (repo-plan.md's layer 5, split last), and names all
# fifteen of its Hyprforge dependencies as git dependencies in its own
# Cargo.toml so that manifest works unchanged both here and as the root
# of its own standalone repository.
hyprforge-core = { path = "crates/hyprforge-core" }
hyprforge-ui = { path = "crates/hyprforge-ui" }
hyprforge-windowrules = { path = "crates/hyprforge-windowrules" }
hyprforge-input = { path = "crates/hyprforge-input" }
hyprforge-appearance = { path = "crates/hyprforge-appearance" }
hyprforge-session = { path = "crates/hyprforge-session" }
hyprforge-system = { path = "crates/hyprforge-system" }
hyprforge-shortcuts = { path = "crates/hyprforge-shortcuts" }
hyprforge-lua-import = { path = "crates/hyprforge-lua-import" }
hyprforge-tray = { path = "crates/hyprforge-tray" }
hyprforge-mime = { path = "crates/hyprforge-mime" }
# The siblings the files, displayd and emojimenu split named by git URL,
# and the popups' shared shell. Missing from this table, each one quietly
# built from whatever GitHub had at the lockfile's commit instead of from
# this checkout — so a fix here to the archive crate, the popup shell or
# the file operations never reached Files, the tray or the clipboard, and
# their tests ran against yesterday's copies. `check.sh`'s "Siblings build
# from this checkout" step now fails if a manifest names a sibling this
# table does not redirect.
hyprforge-archive = { path = "crates/hyprforge-archive" }
hyprforge-clipboard = { path = "crates/hyprforge-clipboard" }
hyprforge-emoji = { path = "crates/hyprforge-emoji" }
hyprforge-fileops = { path = "crates/hyprforge-fileops" }
hyprforge-files-core = { path = "crates/hyprforge-files-core" }
hyprforge-popup = { path = "crates/hyprforge-popup" }
hyprforge-process = { path = "crates/hyprforge-process" }
hyprforge-image = { path = "crates/hyprforge-image" }
hyprforge-icons = { path = "crates/hyprforge-icons" }
hyprforge-thumbnails = { path = "crates/hyprforge-thumbnails" }
hyprforge-video = { path = "crates/hyprforge-video" }
