[workspace]
resolver = "2"
members = [
    "crates/notif-types",
    "crates/notif-config",
    "crates/notif-dbus",
    "crates/notif-core",
    "crates/notif-render",
    "crates/notif-wl",
    "crates/notif-ipc",
    "bin/notifd",
    "bin/notifctl",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# The suite's shared look, by crates.io version, like every other
# component's siblings — so this manifest works unchanged as the root of
# its own repository (hyprforge-suite/hyprforge-notif). Inside the suite,
# `crates/.cargo/config.toml` patches both back to the local copies: this
# workspace is its own root, and the suite's [patch.crates-io] does not
# reach it.
#
# `hyprforge-look` is deliberately runtime-free — no zbus, no tokio, no
# async-io, not even a GUI toolkit — so depending on it from here cannot
# reintroduce the feature-unification problem that keeps these two
# workspaces apart (see `exclude` in the suite's Cargo.toml). It is Color,
# Theme and the file they are read from, and nothing else.
hyprforge-look = "0.1"
# Only for `lock_toml_path()`: where the shared theme is published. This
# crate has no dependencies at all.
hyprforge-paths = "0.1"
serde_json = "1"
toml = "1.1.2"
async-channel = "2"
async-io = "2"
futures-lite = "2"
inotify = { version = "0.11", default-features = false }
thiserror = "2"
log = "0.4"
zvariant = "5"
zbus = { version = "5", default-features = false, features = ["async-io"] }
tempfile = "3"
smithay-client-toolkit = { version = "0.20", default-features = false }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-backend = "0.3"
anyhow = "1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
async-executor = "1"
ctrlc = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
