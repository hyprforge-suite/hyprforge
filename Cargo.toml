[package]
name = "hyprforge-photos"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hyprforge-photos"
path = "src/main.rs"

[dependencies]
# Measuring, orienting and decoding within a budget. The whole reason
# the viewer never hands iced a path handle — see that crate's doc.
hyprforge-image.workspace = true
# Directly as well as through `hyprforge-image`: the info panel names the
# format a file is (`image::ImageFormat`), and a crate that uses a type
# must say so rather than relying on a dependency's dependency happening
# to be in the tree.
image.workspace = true
# 3D models — STL, 3MF, OBJ — loaded into a mesh, with fstl's camera:
# the model half of view3d, which this viewer took over. The renderer is
# here (`src/model/`), not there, because its wgpu has to be iced's.
hyprforge-mesh.workspace = true
# The renderer's matrices and vertex bytes, at the versions hyprforge-mesh
# already uses, so the mesh's `Vertex` and `Mat4` are the renderer's own.
glam = "0.25"
bytemuck = { version = "1", features = ["derive"] }
# The listing, so "the next picture" means the next one the file manager
# was showing. Not `hyprforge-files-core`: a viewer has no use for a
# browser widget, and this is the leaf under both.
hyprforge-listing.workspace = true
# The suite's keyboard grammar. This app answers its one open question
# differently from the file manager — see `keys.rs` and `BareKeys`.
hyprforge-keys.workspace = true
hyprforge-ui.workspace = true
hyprforge-look.workspace = true
hyprforge-appearance.workspace = true
hyprforge-paths.workspace = true
# The actions that touch files, each through the suite's own library for
# it rather than a copy: `trash` from the file operations the file
# manager uses (reversible, the freedesktop spec, the cross-filesystem
# case), the MIME database for which program "Open With…" hands a
# picture to, the clipboard *library* — never the history daemon, which
# need not be installed — for Copy, and the wallpaper settings the
# Desktop screen edits for Set as Wallpaper, so the two never disagree.
# The last is the one Hyprland-shaped dependency here, taken deliberately
# (photos-plan.md, open question 2); without hyprpaper running it saves
# the choice and says so.
hyprforge-fileops.workspace = true
hyprforge-mime.workspace = true
hyprforge-clipboard.workspace = true
hyprforge-ecosystem.workspace = true
hyprforge-core.workspace = true
# `tokio` on top of the workspace base, the same addition
# `hyprforge-files` and `hyprforge-settings` make and for the same
# reason: it selects iced's tokio executor, so the futures a `Task` runs
# are polled inside a tokio runtime. Without it `Task::perform` runs on a
# `futures` thread pool with no ambient runtime and the free function
# `tokio::task::spawn_blocking()` panics with "there is no reactor
# running" — which a viewer would hit on the first picture it opened,
# since every decode goes off the UI thread.
#
# Declared here rather than inherited: that unification only happens when
# something builds both, so `cargo build -p hyprforge-photos` alone would
# not get it.
iced = { workspace = true, features = ["tokio", "image"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# Local days and times: the grid's date headings, the library's date
# spans and the inspector's "Sat 12 Sep 2026 · 18:42". The same crate and
# features the file manager formats its Modified column with.
chrono.workspace = true
# A picture opened on its own floats itself on Hyprland (`float.rs`):
# three `hyprctl` calls, each bounded by hyprforge-process's timeout, and
# `hyprctl -j`'s JSON read back to find the monitor and the window.
hyprforge-process.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
# `MockBackend`, so the folder model — what the next picture is, what
# happens at the ends, what a folder of mixed stills and clips does — is
# exercised without a disk.
hyprforge-listing = { workspace = true, features = ["mock"] }
