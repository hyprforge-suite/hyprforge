[package]
name = "hyprforge-displayd"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hyprforge_displayd"
path = "src/lib.rs"

[[bin]]
name = "hyprforge-displayd"
path = "src/bin/displayd.rs"

[[bin]]
name = "hyprforge-displayctl"
path = "src/bin/displayctl.rs"

[dependencies]
# No `gui`: the daemon has no UI, so it skips iced entirely.
hyprforge-core = { workspace = true, features = ["dbus"] }
zbus.workspace = true
wayland-client.workspace = true
wayland-protocols-wlr.workspace = true
# "process" for the best-effort `hyprctl monitors -j` call that gets
# Hyprland's own connector descriptions for the static monitors.lua
# fallback — see src/hyprctl_monitors.rs.
tokio = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
blake3.workspace = true
futures-util.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
