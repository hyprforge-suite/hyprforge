[package]
name = "hyprforge-lock"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hyprforge-lock"
path = "src/main.rs"

[dependencies]
hyprforge-authui.workspace = true
hyprforge-core.workspace = true
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
# Versions pinned to whatever smithay-client-toolkit 0.20 already pulls
# in. The Wayland source and the ping have to come from the *same*
# calloop as the toolkit's, or the event loop can't hold both.
calloop = "0.14"
calloop-wayland-source = "0.4"
pam-client2 = "0.5"
thiserror.workspace = true
clap.workspace = true
