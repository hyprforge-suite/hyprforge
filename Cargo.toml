[workspace]
resolver = "3"
members = [
    "crates/hyprforge-core",
    "crates/hyprforge-displayd",
    "crates/hyprforge-windowrules",
    "crates/hyprforge-settings",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
hyprforge-core = { path = "crates/hyprforge-core" }
hyprforge-windowrules = { path = "crates/hyprforge-windowrules" }

iced = "0.14"
zbus = "5.18"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
blake3 = "1.8"
futures-util = "0.3"
