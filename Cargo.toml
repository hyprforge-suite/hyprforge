[package]
name = "hyprforge-tray"
version.workspace = true
edition.workspace = true
license.workspace = true

# The library is the StatusNotifierItem protocol and nothing else — it
# knows nothing about Wi-Fi or Bluetooth, the same way hyprforge-ui knows
# nothing about Hyprland. The binary below is what joins it to them.
[[bin]]
name = "hyprforge-trayd"
path = "src/bin/trayd.rs"

[dependencies]
# A tray icon is a D-Bus object, not a toolkit widget. That is the whole
# reason this is possible at all: the suite forbids GTK and Qt, and every
# other way to put an icon in a bar drags one of them in.
zbus.workspace = true
# "process" for spawning `hyprforge-settings --screen <name>` on a click,
# never waited on — see the comment on `handle_clicks` in trayd.rs.
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
# Where the preference file lives, and the atomic write that replaces it.
hyprforge-paths.workspace = true
serde.workspace = true
toml.workspace = true
anyhow.workspace = true

# Used only by the binary. Cargo has no way to say that for a crate with
# both, and splitting into two crates to express it would be more
# ceremony than the fact is worth — hyprforge-displayd carries the same
# arrangement.
hyprforge-network.workspace = true
hyprforge-bluetooth.workspace = true
# Keep awake (systemd-logind) and night light (hyprsunset via hyprctl) —
# same "binary-only" arrangement as network/bluetooth above.
hyprforge-power.workspace = true
hyprforge-ecosystem.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
hyprforge-network = { workspace = true, features = ["mock"] }
hyprforge-bluetooth = { workspace = true, features = ["mock"] }
