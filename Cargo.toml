[package]
name = "hyprforge-emojimenu"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hyprforge-emojimenu"
path = "src/main.rs"

[dependencies]
hyprforge-emoji.workspace = true
hyprforge-clipboard.workspace = true
# The layer-shell surface, its event loop, pointer/keyboard handling,
# placement and the single-instance lock — see the `hyprforge-clipmenu`
# binary's own
# manifest comment for why a picker depends on this instead of copying
# ~1800 lines of Wayland/iced plumbing. This crate is also where the one
# genuine gap this picker needed closed lives: long-press detection (see
# `hyprforge_popup::PopupApp::long_press_duration`/`pointer_long_press`).
hyprforge-popup.workspace = true
hyprforge-appearance.workspace = true
hyprforge-look.workspace = true
hyprforge-paths.workspace = true
hyprforge-process.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Same reasoning as `hyprforge-clipboard`'s manifest for every one of
# these iced-related lines — this crate paints through
# `iced_tiny_skia::Renderer` the same way, with no windowing backend of
# its own beyond the Wayland layer-shell surface `hyprforge-popup` sets
# up.
iced_tiny_skia = { workspace = true, default-features = false, features = ["wayland"] }
iced_runtime.workspace = true
iced_widget.workspace = true
# `iced_widget` depends on `iced_renderer` unconditionally (not behind
# any of its own feature flags — see its Cargo.toml), and `iced_renderer`
# refuses to *link* in release mode unless one of its own "wgpu" or
# "tiny-skia" features is on, which nothing else in this crate's own
# dependency graph turns on the way `hyprforge-clipboard`'s manifest
# explains happens for `hyprforge-lock` "by accident" via a different
# sibling crate. So it is requested directly here too, even though
# nothing in this crate calls into `iced_renderer` itself — painting
# happens through `iced_tiny_skia::Renderer` alone, exactly as
# `hyprforge-clipmenu` and the lock screen both do.
iced_renderer = { version = "0.14", default-features = false, features = ["tiny-skia"] }
anyhow.workspace = true

[dev-dependencies]
tempfile = "3"
