[package]
name = "hyprforge-look"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Hyprforge suite's shared Color and Theme types, with no GUI toolkit dependency so the lock screen and greeter can paint the same look as every iced app."
repository = "https://github.com/adamrpostjr/hyprforge"
documentation = "https://docs.rs/hyprforge-look"
keywords = ["theme", "color", "hyprland", "wayland", "config"]
categories = ["graphics", "config"]

# No iced. hyprforge-core and hyprforge-appearance read and publish the
# theme without ever opening a window, and a GUI toolkit here would ride
# along into both. Every iced host — the lock screen and greeter
# included, which draw through iced's software renderer — converts at
# its own boundary instead.
[dependencies]
hyprforge-paths.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
