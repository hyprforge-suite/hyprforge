[package]
name = "hyprforge-look"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Hyprforge suite's shared Color and Theme types, with no GUI toolkit dependency so the lock screen and greeter can paint the same look as every iced app."
repository = "https://github.com/adamrpostjr/hyprforge"
documentation = "https://docs.rs/hyprforge-look"
keywords = ["theme", "color", "hyprland", "wayland", "config"]
categories = ["graphics", "config"]

# No iced. The lock screen and the greeter draw into a raw Wayland
# buffer and must be able to use everything here; a GUI toolkit
# dependency would put the shared look out of their reach, which is the
# precise way the look forked in the first place.
[dependencies]
hyprforge-paths.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
