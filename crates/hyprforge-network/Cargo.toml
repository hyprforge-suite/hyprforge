[package]
name = "hyprforge-network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# NetworkManager is already a daemon, so this crate is a client and not a
# second one. `tokio` feature for the same reason displayd needs it: zbus
# otherwise polls on its own thread and anything a handler spawns panics
# with "there is no reactor running".
zbus.workspace = true
tokio.workspace = true
# Bounded subprocess waits, via `output`'s wrapper over `Command::output`.
# This crate is a client of NetworkManager, not of Hyprland, so it depends
# on the leaf crate directly rather than on hyprforge-core.
hyprforge-process.workspace = true
# `Psk`'s redaction is built on this: one implementation of "never render
# this" shared with the typed password on the lock screen and greeter.
hyprforge-secret.workspace = true
serde.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[features]
# Exposes `backend::mock::MockBackend` outside `#[cfg(test)]`, so another
# crate's own tests (hyprforge-settings' Network screen) can drive a
# `NetworkBackend` without a real D-Bus connection.
mock = []
