[package]
name = "hyprforge-thumbnails"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The freedesktop thumbnail cache: find a file's thumbnail if it is still current, and store a new one as small as it can be."
repository = "https://github.com/hyprforge-suite/hyprforge"

# A leaf: no GUI toolkit, nothing Hyprland-shaped. Pixels in, pixels out;
# producing a thumbnail is the caller's business, and so is drawing one.
[dependencies]
# The thumbnail file format *is* PNG, with its source's URI and mtime in
# tEXt chunks — which `image`'s own PNG path cannot read or write. Already
# in the tree under `image`, at this version.
png = "0.18"
# A thumbnail's name is the MD5 of its source's URI, by specification.
# Not for security; for agreeing with every other program's file names.
md-5 = "0.10"
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
