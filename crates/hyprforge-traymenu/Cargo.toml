[package]
name = "hyprforge-traymenu"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hyprforge-traymenu"
path = "src/main.rs"

[dependencies]
# `menu::{Menu, MenuItem}` only — the plain-data model `hyprforge-trayd`
# already builds and now serialises to this popup's stdin instead of
# serving over `com.canonical.dbusmenu`. This crate never opens a D-Bus
# connection of its own and never links `zbus`; it only depends on
# `hyprforge-tray` for the shared type, the same way `hyprforge-clipmenu`
# depends on `hyprforge-clipboard` for `Entry` alone. That does pull
# `hyprforge-tray`'s own dependencies (zbus, hyprforge-network,
# hyprforge-bluetooth, …) into this binary's build graph even though
# nothing here calls into any of them — a real cost of sharing the type
# this way, worth naming rather than hiding: see this crate's own
# `src/main.rs` module doc.
hyprforge-tray.workspace = true
# The layer-shell surface, its event loop, pointer/keyboard handling,
# placement and the single-instance lock — see `hyprforge-clipmenu`'s own
# manifest comment for why a popup depends on this instead of copying
# ~1800 lines of Wayland/iced plumbing.
hyprforge-popup.workspace = true
hyprforge-appearance.workspace = true
hyprforge-look.workspace = true
serde.workspace = true
serde_json.workspace = true
# Same reasoning as `hyprforge-clipmenu`'s manifest for every one of
# these iced-related lines — this crate paints through
# `iced_tiny_skia::Renderer` the same way, with no windowing backend of
# its own beyond the Wayland layer-shell surface `hyprforge-popup` sets
# up.
iced_tiny_skia = { workspace = true, default-features = false, features = ["wayland"] }
iced_runtime.workspace = true
iced_widget.workspace = true
# `iced_widget` depends on `iced_renderer` unconditionally, and
# `iced_renderer` refuses to *link* in release mode unless one of its own
# "wgpu" or "tiny-skia" features is on — see `hyprforge-emojimenu`'s
# manifest comment for the full story. Requested directly here for the
# same reason, even though nothing in this crate calls into
# `iced_renderer` itself.
iced_renderer = { version = "0.14", default-features = false, features = ["tiny-skia"] }
anyhow.workspace = true

[dev-dependencies]
tempfile = "3"
