[package]
name = "hyprforge-authui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "The one authentication screen the lock screen and greeter share: background, clock, prompt and a Backend seam for PAM or greetd, drawn with iced 0.14 through iced_tiny_skia"

[dependencies]
hyprforge-look.workspace = true
hyprforge-ui.workspace = true
# `Conversation::pending` — the second copy of a typed password kept
# while the backend restarts — is a `Secret<String>`, the same wrapper
# `hyprforge-network`'s Wi-Fi passphrase uses, rather than a second
# hand-written "never render this".
hyprforge-secret.workspace = true
iced_widget = { workspace = true, features = ["image", "canvas"] }
iced_runtime.workspace = true
chrono.workspace = true
image.workspace = true

[dev-dependencies]
tempfile = "3"
iced_tiny_skia = { workspace = true, features = ["image", "geometry"] }
tiny-skia = "0.11"
png = "0.17"
