[package]
name = "hyprforge-settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hyprforge-core = { workspace = true, features = ["dbus"] }
hyprforge-ui.workspace = true
hyprforge-windowrules.workspace = true
hyprforge-input.workspace = true
hyprforge-appearance.workspace = true
hyprforge-look.workspace = true
hyprforge-paths.workspace = true
image.workspace = true
hyprforge-ecosystem.workspace = true
hyprforge-session.workspace = true
hyprforge-system.workspace = true
hyprforge-shortcuts.workspace = true
hyprforge-lua-import.workspace = true
hyprforge-network.workspace = true
hyprforge-bluetooth.workspace = true
hyprforge-tray.workspace = true
async-trait.workspace = true
# "tokio" selects iced's tokio executor backend, which is what provides
# `iced::time::every` (used for the revert countdown) — the app already runs
# on tokio for its D-Bus work, so this aligns the two rather than adding a
# second runtime.
iced = { workspace = true, features = ["canvas", "tokio"] }
zbus.workspace = true
serde.workspace = true
serde_json.workspace = true
# "process" for the hyprctl calls that float/pin the revert prompt.
tokio = { workspace = true, features = ["process"] }
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[dev-dependencies]
tempfile = "3"
# "mock" for `hyprforge_network::backend::mock::MockBackend`, which the
# Network screen's tests drive instead of a real D-Bus connection.
hyprforge-network = { workspace = true, features = ["mock"] }
# "mock" for `hyprforge_bluetooth::backend::mock::MockBackend`, which the
# Bluetooth screen's tests drive instead of a real D-Bus connection.
hyprforge-bluetooth = { workspace = true, features = ["mock"] }
# `test-util` for `#[tokio::test(start_paused = true)]`: the displayd call
# bounds are 5s and 25s, and a test suite must not spend half a minute
# actually waiting them out to prove they fire.
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
