# notif configuration file
#
# Everything here is optional. Anything you leave out comes from the
# Hyprforge theme this machine publishes — the same file the lock screen
# and the Settings app read — so notifications match your windows
# without being told the colours twice.
#
# The colour, font and rounding lines below are therefore commented out:
# uncommenting one stops that value following the theme, for good. The
# values shown beside them are what the *built-in* theme gives, which is
# what you see on a machine where nothing else has been configured.

# Corner to anchor the notification stack
# Options: top_left, top_right, bottom_left, bottom_right
anchor = "top_right"

# Horizontal margin from screen edge (pixels)
margin_x = 12

# Vertical margin from screen edge (pixels)
margin_y = 12

# Gap between notifications (pixels)
gap = 8

# Maximum notification width (pixels)
max_width = 400

# Maximum notification height (pixels)
max_height = 200

# Maximum number of notifications visible at once
max_visible = 5

# Font settings. From the theme (gsettings, times its accessibility
# scale) unless set here.
# font_family = "Sans"
# font_size = 15.0

# Icon size (pixels)
icon_size = 48

# Wayland output name to display on (null = focused output)
# output = "DP-1"

# Number of notifications to keep in history
history_limit = 100

# Process HTML/Pango markup in notification bodies
body_markup = true

# Notification center panel width (logical pixels, 1–8192)
# Deprecated: use [center].width instead.
center_width = 400

# Notification-center panel overrides. Every field is optional and falls
# back to the corresponding top-level value above (colors/border/radius
# fall back to [normal]) when unset. Uncomment to override.
[center]
# anchor = "top_right"
# margin_x = 12
# margin_y = 12
# width = 400
# max_entries = 100
# font_family = "Sans"
# font_size = 15.0
# background = "#26263a"
# foreground = "#f8f8f2"
# border_color = "#bd93f9"
# border_width = 1
# corner_radius = 12

# Low urgency style. Colours and rounding come from the theme.
[low]
# background = "#26263a"    # theme: surface
# foreground = "#f8f8f2"    # theme: foreground
# border_color = "#373a47"  # theme: card border — present, not shouting
# border_width = 1
# corner_radius = 12        # theme: rounding
default_timeout_ms = 5000
ignore_timeout = false

# Normal urgency style. The border is the theme's accent, which is
# Hyprland's own `general:col:active_border`.
[normal]
# background = "#26263a"
# foreground = "#f8f8f2"
# border_color = "#bd93f9"  # theme: accent
# border_width = 1
# corner_radius = 12
default_timeout_ms = 8000
ignore_timeout = false

# Critical urgency style. The theme's error colour, and never
# self-dismissing — that last part is the freedesktop spec, not taste.
[critical]
# background = "#26263a"
# foreground = "#ff5555"    # theme: error
# border_color = "#ff5555"  # theme: error
# border_width = 2
# corner_radius = 12
default_timeout_ms = 0
ignore_timeout = true
