[package]
name = "hyprforge-secret"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A Secret<T> wrapper whose Debug impl renders only a length, never the wrapped value, so every place a password or passphrase is exposed is a single greppable expose() call."
repository = "https://github.com/adamrpostjr/hyprforge"
documentation = "https://docs.rs/hyprforge-secret"
keywords = ["secret", "redact", "debug", "password", "hyprland"]
categories = ["development-tools::debugging", "rust-patterns"]

# Deliberately no dependencies at all, like hyprforge-paths and
# hyprforge-process. "Never render this" is a rule about a value, not
# about Hyprland or any particular app, and a wrapper for it should be
# usable by anything on this desktop that ever reads a password or a
# passphrase.
[dependencies]
