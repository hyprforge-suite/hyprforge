[package]
name = "hyprforge-shortcuts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Only for paths + the shared require-line installer — default-features = false
# keeps iced out of this pure-logic crate.
hyprforge-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
# Dev-only: exercises import.rs against the real sandboxed evaluator rather
# than hand-built JSON, without adding mlua to this crate's own dependency
# graph — see import.rs's module docs for why production code never
# depends on this crate directly.
hyprforge-lua-import.workspace = true
