[package]
name = "hyprforge-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The GUI half moved to hyprforge-ui, so nothing here needs iced any
# more. `dbus` stays optional: only the settings app, displayctl and the
# tray's displays icon talk to the display daemon.
dbus = ["dep:zbus"]

[dependencies]
hyprforge-paths.workspace = true
hyprforge-look.workspace = true
hyprforge-process.workspace = true
zbus = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
