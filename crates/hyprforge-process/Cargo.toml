[package]
name = "hyprforge-process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "A bounded replacement for Command::output() so a hung subprocess like hyprctl, gsettings or fc-list never blocks the caller forever."
documentation = "https://docs.rs/hyprforge-process"
keywords = ["subprocess", "timeout", "command", "process", "hyprland"]
categories = ["os"]

# Deliberately no dependencies at all, like hyprforge-paths. Running a
# subprocess with a bound on how long it can take is not Hyprland config
# machinery, and any app on this desktop — not just the ones that also
# talk to hyprctl — can need it.
[dependencies]
