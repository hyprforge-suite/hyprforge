[package]
name = "hyprforge-bluetooth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Bluetooth adapters, devices and pairing over BlueZ, behind a backend trait with a mock so everything above the D-Bus client is testable on a machine with no adapter"

[dependencies]
# bluetoothd is already a daemon, so this crate is a client and not a
# second one. `tokio` feature for the same reason displayd needs it: zbus
# otherwise polls on its own thread and anything a handler spawns panics
# with "there is no reactor running".
zbus.workspace = true
tokio.workspace = true
# Bounded subprocess waits, via `output`'s wrapper over `Command::output`.
# This crate is a client of BlueZ, not of Hyprland, so it depends on the
# leaf crate directly rather than on hyprforge-core.
hyprforge-process.workspace = true
serde.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[features]
# Exposes `backend::mock::MockBackend` outside `#[cfg(test)]`, so another
# crate's own tests (hyprforge-settings' Bluetooth screen) can drive a
# `BluetoothBackend` without a real D-Bus connection.
mock = []

# docs.rs builds with every feature on, so the mock backend (and, for
# core, the D-Bus proxy) is documented rather than hidden behind a flag
# nobody reading the docs knows to enable.
[package.metadata.docs.rs]
all-features = true
