[package]
name = "hyprforge-paths"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "XDG config paths, the user's own Pictures/Downloads directories, and crash-safe atomic file writes shared by every app in the Hyprforge desktop suite."
repository = "https://github.com/hyprforge-suite/hyprforge"
documentation = "https://docs.rs/hyprforge-paths"
keywords = ["xdg", "config-dir", "atomic-write", "hyprland", "linux"]
categories = ["filesystem", "config"]

# Deliberately no dependencies at all. Every Hyprforge app needs to know
# where its config lives and how to write a file without leaving a
# half-written one behind; nothing about that should drag in a GUI
# toolkit, a Lua runtime, or Hyprland.
[dependencies]

[dev-dependencies]
tempfile = "3"
