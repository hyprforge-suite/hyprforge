[package]
name = "hyprforge-popup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "The wlr-layer-shell popup shell the clipboard, emoji and tray menus share: surface, event loop, placement, single-instance lock and kit widgets, drawn with iced 0.14 on iced_tiny_skia"

[dependencies]
# `Theme` is the one thing every consumer draws with — CLAUDE.md: "no
# app may define its own colour constant."
hyprforge-look.workspace = true
# `command::output`/`TIMEOUT`, for the bounded `hyprctl` calls
# `placement` makes. No `hyprforge-core`: this crate must stay a leaf a
# new popup can depend on without pulling in Hyprland config machinery,
# an async runtime, or D-Bus.
hyprforge-process.workspace = true
serde_json.workspace = true
# Same reasoning `hyprforge-clipboard`'s manifest gives for each of these
# (where the `hyprforge-clipmenu` binary's dependencies now live):
# a layer-shell popup with no windowing backend of its own, painting
# straight into the buffer the compositor hands over.
iced_tiny_skia = { workspace = true, default-features = false, features = ["wayland"] }
iced_runtime.workspace = true
iced_widget.workspace = true
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
# `wp_viewporter` and `wp_fractional_scale_v1` — SCTK 0.20 has no support
# for either, so this crate binds and dispatches them by hand (see
# `popup.rs`'s own module doc for why). Not a new dependency to the
# workspace: already in `Cargo.lock`, pulled in by `hyprforge-clipboard`'s
# manifest for `ext-data-control-v1` — this is the first *other* crate to
# use it, for a different pair of protocols out of the same crate.
# "staging" is what gates `fractional-scale-v1`, which has not graduated
# to stable; `viewporter` itself is already stable and needs no feature.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
tiny-skia = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
