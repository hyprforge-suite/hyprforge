[package]
name = "hyprforge-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Autostart, environment variables, touchpad gestures and app permissions in a Hyprland session, as one generated Lua file; Hyprforge-internal, published so the suite's apps build from crates.io"

[dependencies]
hyprforge-core.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Path only, so `cargo publish` strips it: the testkit is never published.
hyprforge-testkit = { path = "../hyprforge-testkit" }
tempfile = "3"
