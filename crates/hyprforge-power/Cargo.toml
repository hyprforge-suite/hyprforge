[package]
name = "hyprforge-power"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Keep-awake inhibitors, battery state and power profiles over systemd-logind, UPower and power-profiles-daemon, each behind its own backend trait with a mock"

[dependencies]
# systemd-logind is already a daemon, so this crate is a client and not a
# second one. `tokio` feature for the same reason displayd needs it: zbus
# otherwise polls on its own thread and anything a handler spawns panics
# with "there is no reactor running".
zbus.workspace = true
tokio.workspace = true
serde.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
# The bounded wait for `kill` when keep awake is turned off — see
# `keep_awake`. A leaf with no dependencies of its own.
hyprforge-process.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[features]
# Exposes `backend::mock::MockBackend` outside `#[cfg(test)]`, so another
# crate's own tests (the tray's "keep awake" item, wired up separately)
# can drive an `InhibitBackend` without a real D-Bus connection.
mock = []

# docs.rs builds with every feature on, so the mock backend (and, for
# core, the D-Bus proxy) is documented rather than hidden behind a flag
# nobody reading the docs knows to enable.
[package.metadata.docs.rs]
all-features = true
