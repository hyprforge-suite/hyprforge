[package]
name = "hyprforge-files-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "The model layer of the Hyprforge file manager: the Browser update/view state shared with the portal's file dialog, the fuzzy path bar, preferences, clipboard, drag, undo and sidebar, over iced 0.14 widgets"

[dependencies]
# Only `format::looks_decodable`, to know which entries are worth asking
# the host to decode — the same answer the decoder itself goes by.
hyprforge-image.workspace = true
# The browser view lives here, not in the app, because the portal's
# open/save dialog must render the *same* view — that is the whole
# reason this crate is separate from `hyprforge-files`.
#
# Deliberately never hyprforge-core — that is Hyprland config machinery
# and a new app should not need it.
# `canvas` on top of the workspace base. The navigation glyphs are
# *drawn* rather than typed — see `glyph.rs` for why a font character was
# the wrong tool — and a stroked path is what draws them.
#
# Cargo unifies features, so this is already on in any build that
# includes `hyprforge-settings`, which enables it for the layout editor.
# Declared here anyway: `cargo build -p hyprforge-files-core` alone must
# also get it, and a feature that only works because a sibling happens to
# be in the same build is a trap.
# `image` for the grid's thumbnails and the preview pane: pixels the
# host decoded, drawn as `Handle::from_rgba`. `svg` for the icon theme's
# file-type icons, nearly all of which are SVG — see `icon.rs`.
# `advanced` for `drag`, the one hand-written widget: telling a drag from
# a click has to see the press before the row's button captures it,
# which no stock widget does.
iced = { workspace = true, features = ["canvas", "image", "svg", "advanced"] }
# The suite's keyboard grammar. `keymap.rs` is now the binding of it to
# this app's `Action` — the parser, the merge policy and the rules about
# which keys may be bound are shared with every other app that has a
# keyboard, so two apps cannot come to disagree about `Ctrl+Plus`.
hyprforge-keys.workspace = true
# The listing itself — entries, the backend seam, sorting, filtering.
# Moved out when the image viewer needed the same ordering; re-exported
# from this crate's root under the names it used to have.
hyprforge-listing.workspace = true
hyprforge-ui.workspace = true
hyprforge-look.workspace = true
hyprforge-paths.workspace = true
hyprforge-fileops.workspace = true
# Archives browse as directories — see `archive.rs`. A leaf dependency,
# like `hyprforge-fileops` beside it: nothing GUI, nothing Hyprland.
hyprforge-archive.workspace = true
# The Devices and Remote sidebar sections draw drives and shares — the
# data and the decisions only. The workspace entry leaves its D-Bus
# client off: talking to UDisks2 and gvfs is the window's, and the
# open/save dialog renders this same view.
hyprforge-volumes.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml.workspace = true
# Preferences writes `files-config.toml`, which a person may also have
# written by hand: one entry changes and every comment around it stays.
# See `config_edit.rs`.
toml_edit.workspace = true
# The design's list view shows a Modified column; formatting an
# `Entry::modified: Option<SystemTime>` into a calendar date needs a
# calendar, which `std` deliberately does not carry.
chrono.workspace = true
# `content:` searches a file's bytes as they stream past — see
# `content.rs`. `memchr2` finds a needle's first letter in either case
# without making a lowercased copy of every chunk.
memchr.workspace = true
# Bulk rename's "regular expression" switch — see `bulk_rename.rs`.
regex.workspace = true
# Recent reads and records `recently-used.xbel` — see `recent.rs`. A
# streaming reader, because what Recent writes back has to keep every
# other application's entry as the bytes they wrote, and only a reader
# that reports where each element starts and ends can do that.
quick-xml.workspace = true

[dev-dependencies]
tempfile = "3"
# `MockBackend` used to be reachable from this crate's own tests through
# `cfg(test)`, because it lived here. It lives in `hyprforge-listing` now,
# where `cfg(test)` means *that* crate's tests — so the fake has to be
# asked for by feature, exactly as the app and the portal dialog already
# ask for it.
hyprforge-listing = { workspace = true, features = ["mock"] }
# This crate's *own* tests browse a seeded archive, so this crate is
# what has to ask for the mock. It used to arrive by feature
# unification — `hyprforge-files` dev-depends on this crate with
# `features = ["mock"]`, and that happened to switch the archive mock on
# for this crate's tests too. That is a dependency on somebody else's
# manifest to make your own tests compile, and it broke the moment
# `hyprforge-files` named this crate as a git dependency in preparation
# for standing alone.
hyprforge-archive = { workspace = true, features = ["mock"] }

[features]
# The fakes, for the app's and the portal's own tests: the filesystem
# one lives in `hyprforge-listing` now, along with the backend seam it
# fakes, and the archive one in `hyprforge-archive`. Forwarding rather
# than renaming is what keeps the app's dev-dependency line — and every
# test that drives a window against `MockBackend` — exactly as it was
# written.
mock = ["hyprforge-listing/mock", "hyprforge-archive/mock"]

# docs.rs builds with every feature on, so the mock backend (and, for
# core, the D-Bus proxy) is documented rather than hidden behind a flag
# nobody reading the docs knows to enable.
[package.metadata.docs.rs]
all-features = true
