[package]
name = "hyprforge-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The iced widget layer built on hyprforge-look's shared theme, giving every Hyprforge app the same spacing scale, palette and widgets."
repository = "https://github.com/adamrpostjr/hyprforge"
documentation = "https://docs.rs/hyprforge-ui"
keywords = ["iced", "widgets", "gui", "hyprland", "theme"]
categories = ["gui"]

# The shared iced layer: one spacing scale, one palette, one set of
# widgets, so a sidebar in Settings and a sidebar in the file manager
# breathe the same amount. Depends on hyprforge-look for the values and
# on nothing that knows about Hyprland — a calculator should be able to
# use this without inheriting Lua codegen.
[dependencies]
hyprforge-look.workspace = true
# For `keys`, the one adapter from an iced key event to the suite's
# keyboard grammar. Downward onto a leaf with no dependencies of its own,
# so it costs a link and nothing else — and it is what lets
# `hyprforge-keys` stay free of iced, which is the point of both crates.
hyprforge-keys.workspace = true
# `canvas` for `glyph`: the drawn marks, stroked because a chevron or a
# battery cannot be built out of axis-aligned boxes and a font's own
# symbols are a different shape on every machine.
iced = { workspace = true, features = ["canvas"] }
