# greetd's own configuration. Install as /etc/greetd/config.toml.
#
# A template, not a drop-in: `vt`, the username and the session command
# all have to match the machine. Read it before installing it — getting
# this wrong means a login screen that does not appear, on the VT you
# normally log in through.

[terminal]
# The VT the greeter takes over. On a machine that currently logs in at
# a console, this is the VT that stops being a console.
vt = 1

# Whether starting greetd also *switches the display* to that VT.
#
# true is right for the installed configuration: at boot the greeter
# should be what you see. It is wrong while testing, because it yanks the
# screen away from whatever you were doing the instant greetd starts —
# which is not what "test it without committing to anything" should mean.
#
# While testing on a spare VT, set this false and switch with ctrl+alt+F2
# when you are ready to look.
switch = true

[default_session]
# Hyprland, configured to have no keybinds, running the greeter and
# exiting with it. See hyprland-greeter.lua for why the config matters
# more than the greeter does.
#
# Through start-hyprland, not the bare binary. Launching Hyprland
# directly earns a red "started without start-hyprland" banner across
# the screen — which on a login screen is the first thing anyone sees,
# and looks like something is broken. start-hyprland blocks until the
# compositor exits, which is what greetd needs from a session command.
command = "start-hyprland -- --config /etc/greetd/hyprland-greeter.lua"

# The greeter runs as its own unprivileged user — greetd's packaging
# creates it. This is why the theme is an export: `greeter` cannot
# traverse into a home directory to read the real one.
user = "greeter"
