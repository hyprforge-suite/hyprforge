# Publishes every library crate to crates.io when `tools/hf release`
# pushes a `libs-vX.Y.Z` tag — phase A of the two-phase release (see
# tools/hflib/release.py). The suite's own `vX.Y.Z` tag comes later, on
# the commit that pins every component, and publishes nothing.
#
# What is not published is derived, not listed: every component except
# those in tools/hflib/published.toml (the clipboard and the tray, which
# other components use as libraries), plus anything `publish = false`.
# This file used to keep a hand list whose comment said "seven" while it
# excluded nine.
#
# Cargo 1.90+'s `publish --workspace` orders the crates by dependency and
# waits for each wave to appear on the index before the next.
#
# The very first publish of a new crate name is still done by hand:
# crates.io rate-limits new names from one account, and a workflow that
# hits that limit fails halfway through a wave. This workflow is for
# releases where every name already exists and only versions move.

name: Publish to crates.io

on:
  push:
    tags: ["libs-v*"]

jobs:
  publish:
    name: "cargo publish --workspace (libraries only)"
    runs-on: ubuntu-latest
    # crates.io allows a burst of 30 updates, then one a minute, and this
    # publishes more than 30; waiting that out is the job now, not a
    # person's re-run.
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The clipboard and the tray are published from here and are
          # submodules, and the workspace will not load without every
          # component checked out.
          submodules: true

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Install native dependencies
        # The same set check.yml installs: verification builds every crate
        # from its packaged tarball, so anything a library links has to be
        # here even though no binary is produced.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libpam0g-dev libxkbcommon-dev libwayland-dev

      - name: The tag matches the workspace version
        # A tag `v0.2.0` on a tree whose workspace says 0.1.0 would publish
        # 0.1.0 again (an error from the index) or, worse, a version the tag
        # does not name. Refuse rather than guess.
        run: |
          want="${GITHUB_REF_NAME#libs-v}"
          have=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          [ "$want" = "$have" ] || { echo "tag says $want, Cargo.toml says $have"; exit 1; }

      - name: cargo publish --workspace, waiting out the rate limit
        # A 429 stops `cargo publish` with some crates at the new version
        # and some not. Each round therefore first excludes every crate
        # the sparse index already lists at this version (what cargo
        # itself reads; no token, no user agent), publishes the rest, and
        # on a 429 sleeps until the time crates.io names plus a minute,
        # then goes again. Until 0.1.13 this was a person running
        # `gh run rerun --failed` after reading the time off the log.
        env:
          # An organisation secret: a crates.io API token scoped to
          # publish-update (and publish-new, for a library added later),
          # with the hyprforge-* crates as its scope.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#libs-v}"
          unpublished=$(python3 - <<'PY'
          import json, subprocess, tomllib
          meta = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          published = set(tomllib.load(open("tools/hflib/published.toml", "rb"))["components"])
          components = {l.split()[1].split("/")[-1] for l in subprocess.check_output(
              ["git", "config", "-f", ".gitmodules", "--get-regexp", r"^submodule\..*\.path$"], text=True).splitlines()}
          for p in meta["packages"]:
              if p.get("publish") == [] or (p["name"] in components and p["name"] not in published):
                  print(p["name"])
          PY
          )
          echo "not published: $unpublished"
          for round in $(seq 1 12); do
            exclude=""
            for name in $unpublished; do exclude="$exclude --exclude $name"; done
            for name in $(cargo metadata --no-deps --format-version 1 \
                | python3 -c 'import json,sys; print(*(p["name"] for p in json.load(sys.stdin)["packages"]))'); do
              case " $unpublished " in *" $name "*) continue ;; esac
              path="${name:0:2}/${name:2:2}/$name"
              if curl -sf "https://index.crates.io/$path" \
                  | python3 -c "import json,sys; sys.exit(0 if any(json.loads(l)['vers'] == '$version' for l in sys.stdin if l.strip()) else 1)"; then
                exclude="$exclude --exclude $name"
              fi
            done
            if cargo publish --workspace $exclude 2>&1 | tee publish.log; then
              echo "everything is published"
              exit 0
            fi
            if grep -q "already exists on crates.io index" publish.log && ! grep -q "429" publish.log; then
              continue
            fi
            if ! grep -q "429" publish.log; then
              echo "publish failed for a reason other than the rate limit"
              exit 1
            fi
            # "Please try again after Sat, 11 Oct 2026 21:40:12 GMT"
            after=$(grep -o 'try again after [^"]*GMT' publish.log | head -1 | sed 's/try again after //')
            wait=$(( $(date -d "$after" +%s 2>/dev/null || date +%s) - $(date +%s) + 60 ))
            [ "$wait" -lt 60 ] && wait=60
            echo "rate limited until $after; sleeping ${wait}s (round $round)"
            sleep "$wait"
          done
          echo "still not done after 12 rounds"
          exit 1
