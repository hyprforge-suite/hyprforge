# The fast check only, and that is not an oversight.
#
# `tools/hf check --fast` needs nothing but a compiler: clippy, rustdoc,
# the static checks, every ignored test classified into a tier, and the
# unit tier. The other tiers ask real services — a running Hyprland,
# NetworkManager, BlueZ, a bar with a tray — and the disposable tier a
# nested compositor; none exists on a hosted runner, and a green tick
# here must not be read as any of them having passed. docs/testing.md
# has the table.
#
# What this does buy is the `web-colors` check, whose regression is
# invisible to every test and to reading the diff — both renderers report
# the same `Color` and only the pixels differ.
#
# procman's eBPF feature needs clang and libbpf's headers, which this
# runner does not install; `tools/hf` leaves the feature out without clang
# and says so in yellow.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Debug info is the largest thing in a Rust `target/` — routinely
  # several times the size of the code it describes — and a hosted
  # runner has about fourteen gigabytes free. This workspace is forty
  # crates and got heavier when `hyprforge-archive` arrived with zip,
  # zstd, bzip2, liblzma (which builds its C from source) and 7z, and
  # the run after that one went red not on a test but on
  # `rust-cache`'s *save* step: "No space left on device".
  #
  # Nothing here needs line numbers in a backtrace. A failing test names
  # itself, and anyone chasing it further runs `check.sh` locally, where
  # the profile is untouched.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  tier1:
    name: tools/hf check --fast
    runs-on: ubuntu-latest
    steps:
      # The components are submodules: without them every
      # crates/<component> is empty and the workspace will not load.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The runner image ships Android, .NET, GHC and a stack of
      # preinstalled toolchains this build never touches, and they are
      # the difference between fitting and not. Removed before anything
      # is compiled rather than after the failure, because the step that
      # runs out of room is `rust-cache`'s post-run save — which reports
      # as the whole job failing after every test has already passed,
      # and reads as a code failure when it is a disk one.
      - name: Free disk space on the runner
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules \
            "$AGENT_TOOLSDIRECTORY"
          df -h /

      # The native dependencies behind the -sys crates in Cargo.lock:
      #   pam-sys2  -> libpam0g-dev   (hyprforge-lock authenticates)
      #   xkbcommon -> libxkbcommon-dev
      #   wayland-sys -> libwayland-dev
      # mlua is vendored, so it needs a C compiler but no system Lua.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libpam0g-dev libxkbcommon-dev libwayland-dev

      # No toolchain action: rust-toolchain.toml pins the version, and
      # rustup on the runner honours it. One place to raise it.
      - name: Show toolchain
        run: rustc --version && cargo --version && cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      # Every tier runs through nextest (.config/nextest.toml).
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: tools/hf check --fast
        run: tools/hf check --fast
