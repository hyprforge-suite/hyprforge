# The website at https://hyprforge-suite.github.io/hyprforge/.
#
# tools/build-site.py wraps site/pages/ in site/_layout.html and copies in
# docs/images rather than keeping a second copy, so the site, this README
# and the component READMEs always show the same renders. A screenshot the
# site wants but docs/images lacks is drawn as a placeholder naming the file.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "tools/build-site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the site
        run: python3 tools/build-site.py _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
