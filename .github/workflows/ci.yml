# CI for the standalone hyprforge-lock repository (this file only takes
# effect at `.github/workflows/ci.yml` — the path `./split.sh` produces
# once `crates/hyprforge-lock` becomes a repository root).
#
# What this checks: that the crate builds, that clippy is silent (a
# clippy warning is a build failure in Hyprforge — see the upstream
# CLAUDE.md's "Clippy must be silent" rule), and the tier-1 test suite —
# the unit and integration tests that need nothing outside this process.
#
# What this deliberately does NOT check, and must never claim to:
#   - it never runs the lock screen binary, under any flag. Not
#     `--fake-password`, not against a nested compositor, not for a
#     second. Proving the lock screen actually locks, draws and unlocks
#     needs `testing/nested.sh` and a human watching a real (disposable)
#     Wayland session — see this crate's README and the upstream
#     CLAUDE.md's "Never point the lock screen at the live session."
#     Nothing in that story is CI-shaped, and pretending otherwise is
#     exactly the failure this workflow exists to not repeat.
#   - it never touches PAM. There is no `pam_unix`, no faillock, no
#     account on this runner to lock — `PamBackend`'s unit tests (see
#     src/pam.rs) exercise the channel/ping plumbing against a fake
#     conversation, not a real PAM stack.
#   - it never touches logind or a real D-Bus session bus for the
#     `LockedHint` integration in src/logind.rs.
#
# A green run means "the code is internally consistent". It does not
# mean "the code agrees with PAM, logind, or a real compositor" — those
# are exactly the questions the monorepo's later check.sh tiers exist to
# ask, each gated on the thing it actually asks rather than shared
# across an `--ignored` run that would silently never run here.

name: CI

on:
  push:
  pull_request:

jobs:
  tier-1:
    name: "Tier 1 (no PAM, no compositor): build, clippy -D warnings, cargo test"
    runs-on: ubuntu-latest
    env:
      # Cargo fetches git dependencies with libgit2, which does not honour
      # the `url.<..>.insteadOf` rewrite the step below installs — so the
      # credential never reaches the clone and the build fails with
      # "failed to authenticate", even though `git` itself would succeed.
      # Cargo says as much in that error, and this is the setting it
      # names: fetch with the git CLI instead, which does honour it.
      #
      # Goes with the SUITE_READ step below: when the suite repository
      # becomes public, both stop being necessary.
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the system libraries this crate links
        # libpam0g-dev: `pam-client2 = "0.5"` (Cargo.toml) depends on
        # pam-sys2, whose build.rs does
        # `println!("cargo:rustc-link-lib=pam")` unconditionally on
        # Linux — see pam-sys2's build.rs. Without the dev package the
        # link step fails looking for libpam.so (the runtime-only
        # libpam0g package ships libpam.so.0, not the .so symlink a
        # linker needs for `-lpam`).
        #
        # libxkbcommon-dev + pkg-config: two independent things need
        # this crate. First, `smithay-client-toolkit = "0.20"` enables
        # its own default "xkbcommon" feature, whose build.rs runs
        # `pkg_config::Config::new().find("xkbcommon").unwrap()` (see
        # smithay-client-toolkit's build.rs) — that needs both the
        # xkbcommon.pc file and the pkg-config binary. Second, this
        # crate's own transitive dependency on hyprforge-authui /
        # hyprforge-ui pulls in `iced`, which pulls in `xkbcommon-dl`
        # (dlopen-based — no dev package needed for that one) but also,
        # via smithay-client-toolkit's presence in the same graph,
        # re-confirms the same libxkbcommon-dev requirement above.
        # `cargo tree -p hyprforge-lock --edges normal` shows no other
        # *-sys crate performing a build-time system link beyond pam and
        # xkbcommon.
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libxkbcommon-dev pkg-config

      - name: Let cargo fetch the suite while it is still a private repository
        # This crate's Cargo.toml takes hyprforge-* as git dependencies on
        # the suite repository. While that repository is PRIVATE, the
        # built-in GITHUB_TOKEN cannot read it: an Actions token is scoped
        # to the repository the workflow runs in, and says nothing about
        # any other private repository in the same account. Cargo's fetch
        # then fails with "failed to authenticate when downloading
        # repository", which reads like a code problem and is not one.
        #
        # SUITE_READ is a fine-grained token with read-only Contents on
        # the suite repository and nothing else. `insteadOf` rewrites the
        # https:// URL cargo is about to clone so the credential is
        # attached without the manifests naming a token anywhere.
        #
        # This whole step is scaffolding for the private phase. The day
        # the suite repository becomes public, delete it and delete the
        # secret: a public repository is fetched anonymously and this
        # stops being necessary. If CI starts failing with that same
        # authentication error for no apparent reason, the likeliest
        # cause is the token having expired.
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.SUITE_READ }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        # ubuntu-latest ships rustup already; `rustup show` is what
        # makes it notice rust-toolchain.toml in this directory and
        # install exactly the channel and components (clippy, rustfmt)
        # that file pins, rather than whatever `stable` resolves to on
        # the day the job happens to run.
        run: rustup show

      - name: Cache the cargo registry and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo clippy --all-targets -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: "cargo test (tier 1 only — no PAM, no compositor, the lock screen binary is never run)"
        run: cargo test --all-targets
